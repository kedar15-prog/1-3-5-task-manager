<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cyanRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for full maskable & any compatibility -->
  <rect width="512" height="512" fill="url(#bgGradient)" />

  <!-- Outer Safe Zone Dial Glow Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Timer Gauge Arc -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="156" fill="none" stroke="url(#cyanRing)" stroke-width="14" stroke-linecap="round" stroke-dasharray="980" stroke-dashoffset="310" />

  <!-- Stopwatch top crown button -->
  <rect x="238" y="70" width="36" height="18" rx="6" fill="#ffffff" opacity="0.95" />
  <rect x="246" y="60" width="20" height="10" rx="4" fill="#38bdf8" />

  <!-- Stopwatch side button -->
  <rect x="366" y="116" width="16" height="28" rx="6" fill="#ffffff" opacity="0.8" transform="rotate(40 374 130)" />

  <!-- Big Bold 1·3·5 Mark in safe zone -->
  <g transform="translate(0, 5)">
    <!-- 1 -->
    <path d="M 148 214 L 174 196 L 174 278 L 152 278 L 152 226 L 140 234 Z" fill="#ffffff" />
    
    <!-- Dot separator 1 -->
    <circle cx="204" cy="246" r="7" fill="#38bdf8" />

    <!-- 3 -->
    <path d="M 224 198 L 268 198 L 244 230 C 258 231 270 240 270 255 C 270 270 256 280 238 280 C 224 280 214 272 210 264 L 227 254 C 230 259 234 262 240 262 C 247 262 251 257 251 251 C 251 245 246 240 236 240 L 228 240 L 228 224 L 246 209 L 224 209 Z" fill="#ffffff" />

    <!-- Dot separator 2 -->
    <circle cx="286" cy="246" r="7" fill="#38bdf8" />

    <!-- 5 -->
    <path d="M 346 198 L 306 198 L 302 235 C 307 231 315 229 324 229 C 340 229 352 239 352 254 C 352 270 339 280 321 280 C 307 280 297 271 293 262 L 310 253 C 312 258 316 262 322 262 C 328 262 333 257 333 251 C 333 245 328 241 320 241 C 313 241 308 244 305 247 L 290 242 L 294 182 L 346 182 Z" fill="#ffffff" />
  </g>

  <!-- DAILY FOCUS text -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="5">DAILY FOCUS</text>

  <!-- Clock Hand center pivot & pointer -->
  <circle cx="256" cy="180" r="4" fill="#38bdf8" />
  <line x1="256" y1="180" x2="256" y2="140" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
</svg>
